name: Poll GitHub Queue Depth for VMSS Autoscale

on:
  schedule:
    # Every 5 min, offset off the hour boundary (:02, :07, :12, ...).
    # GitHub delays or DROPS scheduled runs during top-of-hour load spikes,
    # so avoid :00/:05. Even so, `on: schedule` is best-effort - for the
    # enterprise deployment run this poll from Azure (Function / Container
    # Apps job) instead of relying on GitHub's scheduler.
    - cron: '2-59/5 * * * *'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: poll-queue-depth
  cancel-in-progress: true   # a fresher count always supersedes an in-flight older one

jobs:
  publish-queue-metric:
    if: vars.COMPUTE_BACKEND == 'vmss' || vars.COMPUTE_BACKEND == ''   # default to vmss if unset, matching the Terraform default
    runs-on: ubuntu-latest   # must be GitHub-hosted - same bootstrapping reasoning as the token refresh workflow
    steps:
      - name: Generate GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RUNNER_BOOTSTRAP_APP_ID }}
          private-key: ${{ secrets.RUNNER_BOOTSTRAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # This App now needs "Actions: Read" org permission in addition
          # to the "Self-hosted runners: Read and write" permission set
          # up for the token-refresh workflow - add it under the App's
          # permissions if it isn't already there.

      - name: Count queued jobs targeting the self-hosted runners
        id: queue-count
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUNNER_SCOPE: ${{ vars.RUNNER_SCOPE || 'org' }}
          OWNER: ${{ github.repository_owner }}
          TARGET_REPO: ${{ github.repository }}
          # A queued job counts only if its runs-on labels are a SUPERSET of
          # every label here (comma-separated). "self-hosted" matches any
          # self-hosted job; "self-hosted,vmss" is VMSS-specific. Default is
          # deliberately broad - narrow it to match your runner labels.
          RUNNER_MATCH_LABELS: ${{ vars.RUNNER_MATCH_LABELS || 'self-hosted' }}
        run: |
          set -euo pipefail

          ghapi() { curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
                             -H "Accept: application/vnd.github+json" \
                             -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }

          WANT_JSON=$(printf '%s' "${RUNNER_MATCH_LABELS}" | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$";""))')

          # The runs endpoint has no runs-on filter, so we go one level down
          # to jobs. Scan runs that could still have unstarted jobs (queued,
          # plus in_progress for matrix legs waiting on a runner), list each
          # run's jobs, and count jobs that are status=queued AND carry all
          # the wanted labels.
          if [ "${RUNNER_SCOPE}" = "repo" ]; then
            REPOS="${TARGET_REPO}"
          else
            REPOS=$(ghapi "https://api.github.com/orgs/${OWNER}/repos?per_page=100&sort=pushed" | jq -r '.[].full_name')
          fi

          COUNT=0
          for R in ${REPOS}; do
            RUN_IDS=$(
              { ghapi "https://api.github.com/repos/${R}/actions/runs?status=queued&per_page=100"
                ghapi "https://api.github.com/repos/${R}/actions/runs?status=in_progress&per_page=100"
              } | jq -r '.workflow_runs[]?.id' | sort -u
            )
            for RID in ${RUN_IDS}; do
              [ -n "${RID}" ] || continue
              N=$(ghapi "https://api.github.com/repos/${R}/actions/runs/${RID}/jobs?per_page=100" \
                | jq --argjson want "${WANT_JSON}" '
                    [ .jobs[]?
                      | select(.status == "queued")
                      | (.labels // []) as $have
                      | select( $want | map(. as $w | $have | index($w)) | all )
                    ] | length')
              COUNT=$((COUNT + N))
            done
          done

          echo "queued=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "Queued jobs matching [${RUNNER_MATCH_LABELS}] (${RUNNER_SCOPE}): ${COUNT}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.QUEUE_POLLER_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish custom metric to Azure Monitor
        env:
          VALUE: ${{ steps.queue-count.outputs.queued }}
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
          # Optional overrides. Leave the repo variables unset and the step
          # resolves the VMSS (id + region) by tag - nothing to keep in sync
          # when the scale set is recreated with a new name.
          VMSS_RESOURCE_ID: ${{ vars.VMSS_RESOURCE_ID }}
          VMSS_REGION: ${{ vars.VMSS_REGION }}
          METRIC_NAMESPACE: "GitHubActionsQueue"             # must match custom_metric_namespace in terraform.tfvars
          METRIC_NAME: "QueuedJobs"                          # must match custom_metric_name in terraform.tfvars
        run: |
          set -euo pipefail

          # Resolve the VMSS if the override vars aren't set. Needs 'Reader'
          # on the resource group for the poller SP - Terraform grants it
          # (custom-metric-autoscale.tf) when queue_poller_principal_id is set.
          if [ -z "${VMSS_RESOURCE_ID}" ] || [ -z "${VMSS_REGION}" ]; then
            [ -n "${RESOURCE_GROUP_NAME}" ] || { echo "::error::RESOURCE_GROUP_NAME repo variable is not set (setup/bootstrap.sh --set-github sets it)"; exit 1; }
            # object projection (not [id,location]) so -o tsv renders ONE
            # tab-separated line for `read` - an array prints one per line.
            read -r VMSS_RESOURCE_ID VMSS_REGION < <(az vmss list -g "${RESOURCE_GROUP_NAME}" \
              --query "[?tags.workload=='github-actions-self-hosted-runner'] | [0].{id:id,location:location}" -o tsv) || true
          fi
          if [ -z "${VMSS_RESOURCE_ID}" ] || [ -z "${VMSS_REGION}" ]; then
            echo "::error::could not resolve the runner VMSS in resource group '${RESOURCE_GROUP_NAME}' - has 'terraform apply' run for the vmss backend?"
            exit 1
          fi

          # Audience must be exactly https://monitoring.azure.com/ (trailing slash required)
          TOKEN=$(az account get-access-token \
            --resource "https://monitoring.azure.com/" \
            --query accessToken -o tsv)

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          BODY=$(jq -n \
            --arg time "${TIMESTAMP}" \
            --arg metric "${METRIC_NAME}" \
            --arg namespace "${METRIC_NAMESPACE}" \
            --argjson value "${VALUE}" \
            '{
              time: $time,
              data: {
                baseData: {
                  metric: $metric,
                  namespace: $namespace,
                  dimNames: [],
                  series: [
                    { dimValues: [], min: $value, max: $value, sum: $value, count: 1 }
                  ]
                }
              }
            }')

          curl -sS -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            "https://${VMSS_REGION}.monitoring.azure.com${VMSS_RESOURCE_ID}/metrics" \
            -d "${BODY}"

          echo "Published ${METRIC_NAME}=${VALUE} to ${METRIC_NAMESPACE}"
