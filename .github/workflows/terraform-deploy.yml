name: Deploy GitHub Runner VMSS (Terraform)

on:
  pull_request:
    branches: [main]
    paths:
      - 'github-runner-vmss/terraform/**'
      - '.github/workflows/terraform-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'github-runner-vmss/terraform/**'
      - '.github/workflows/terraform-deploy.yml'
  workflow_dispatch: {}   # manual re-apply without a code change

permissions:
  id-token: write     # required for Azure OIDC login
  contents: read
  pull-requests: write # lets the plan step comment on the PR

env:
  TF_VERSION: "1.9.8"
  TF_WORKING_DIR: "github-runner-vmss/terraform"

concurrency:
  group: terraform-vmss-${{ github.ref }}
  cancel-in-progress: false   # never cancel a mid-flight apply

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ vars.TF_DEPLOY_AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.TF_DEPLOY_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=github-runner-vmss.tfstate"

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -no-color -input=false -var-file="terraform.tfvars" -out=tfplan \
            | tee plan_output.txt
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.slice(0, 60000) + '\n... (truncated)'
              : plan;
            const body = `#### Terraform Plan\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production   # requires a manual approver - configure under repo Settings > Environments
    env:
      ARM_CLIENT_ID: ${{ vars.TF_DEPLOY_AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.TF_DEPLOY_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=github-runner-vmss.tfstate"

      # bootstrap_agent.sh is uploaded to the bootstrap storage account over
      # its public endpoint (this runner is not in the hub VNet). Open the
      # firewall to just this runner's egress IP for the upload apply, then
      # a second apply puts public_network_access_enabled / ip_rules back at
      # their defaults (off / empty) so the account is private-only at rest.
      - name: Detect runner egress IP
        id: runnerip
        run: echo "ip=$(curl -fsS https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      # Open the storage firewall in a targeted apply first. A -target apply
      # only refreshes the account (and its deps), NOT the private blob - a
      # full apply here would try to HEAD bootstrap_agent.sh over the public
      # endpoint that is still disabled at refresh time and 403. Once the
      # account is reachable, the untargeted apply below uploads the script.
      - name: Terraform Apply (open storage firewall only)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve -input=false -var-file="terraform.tfvars" \
            -target=azurerm_storage_account.bootstrap \
            -var="bootstrap_storage_public_network_access_enabled=true" \
            -var='bootstrap_storage_allowed_ips=["${{ steps.runnerip.outputs.ip }}"]'
          sleep 30   # let the firewall change propagate on the data plane

      - name: Terraform Apply (storage public endpoint open for script upload)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve -input=false -var-file="terraform.tfvars" \
            -var="bootstrap_storage_public_network_access_enabled=true" \
            -var='bootstrap_storage_allowed_ips=["${{ steps.runnerip.outputs.ip }}"]'

      - name: Terraform Apply (re-lock storage public endpoint)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -input=false -var-file="terraform.tfvars"

      # Belt-and-braces: if the open apply above failed partway, the account
      # can be left reachable on its public endpoint (deny-all bar one stale
      # IP). Force it shut directly - the next run's open apply reconciles
      # state. No-op when there's nothing deployed yet.
      - name: Ensure storage public endpoint is locked (safety net)
        if: always()
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true
        run: |
          ACCT=$(terraform output -raw bootstrap_storage_account_name 2>/dev/null) || ACCT=""
          RG=$(terraform output -raw bootstrap_storage_resource_group_name 2>/dev/null) || RG=""
          if [ -z "$ACCT" ] || [ "$ACCT" = "null" ] || [ -z "$RG" ]; then
            echo "No bootstrap storage account deployed - nothing to lock."
            exit 0
          fi
          az storage account update --name "$ACCT" --resource-group "$RG" \
            --public-network-access Disabled --default-action Deny >/dev/null
          # Also drop any IP allow-rules left behind by a half-finished open
          # apply, so the next run's refresh/plan doesn't carry a stale IP.
          for ip in $(az storage account network-rule list --account-name "$ACCT" \
              --resource-group "$RG" --query "ipRules[].ipAddressOrRange" -o tsv); do
            az storage account network-rule remove --account-name "$ACCT" \
              --resource-group "$RG" --ip-address "$ip" >/dev/null
          done
          echo "Locked public endpoint on $ACCT"

      - name: Show outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output
