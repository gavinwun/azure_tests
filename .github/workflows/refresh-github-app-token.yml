name: Refresh GitHub App Token in Key Vault

on:
  schedule:
    # Every 30 minutes - comfortable margin inside the 1-hour token expiry
    # even if a run is delayed (GitHub does not guarantee exact schedule timing).
    - cron: '*/30 * * * *'
  workflow_dispatch: {}   # manual trigger for testing / immediate refresh

permissions:
  id-token: write   # required for Azure OIDC login
  contents: read

concurrency:
  group: refresh-github-app-token
  cancel-in-progress: false   # let an in-flight run finish rather than clobber it

jobs:
  refresh-token:
    runs-on: ubuntu-latest   # GitHub-hosted is fine - this doesn't touch self-hosted infra
    steps:
      - name: Generate GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RUNNER_BOOTSTRAP_APP_ID }}
          private-key: ${{ secrets.RUNNER_BOOTSTRAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}   # scopes to your org's installation

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push token to Key Vault
        run: |
          az keyvault secret set \
            --vault-name "${{ vars.KEYVAULT_NAME }}" \
            --name "github-app-token" \
            --value "${{ steps.app-token.outputs.token }}" \
            --expires "$(date -u -d '+55 minutes' +%Y-%m-%dT%H:%M:%SZ)" \
            --output none

      - name: Confirm write (no secret values logged)
        run: |
          az keyvault secret show \
            --vault-name "${{ vars.KEYVAULT_NAME }}" \
            --name "github-app-token" \
            --query "{updated:attributes.updated, expires:attributes.expires}" \
            --output table
