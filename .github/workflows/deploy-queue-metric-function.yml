name: Deploy Queue-Metric Function

# Builds and deploys github-runner-vmss/queue-metric-function to the
# Consumption Function App provisioned by queue-metric-function.tf.
# Run `terraform apply` with enable_queue_metric_function = true first,
# then set the QUEUE_METRIC_FUNCTION_NAME repo variable from the output:
#   terraform output -raw queue_metric_function_name

on:
  push:
    branches: [main]
    paths:
      - 'github-runner-vmss/queue-metric-function/**'
      - '.github/workflows/deploy-queue-metric-function.yml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-queue-metric-function
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.COMPUTE_BACKEND == 'vmss' || vars.COMPUTE_BACKEND == ''
    runs-on: ubuntu-latest
    env:
      FUNC_DIR: github-runner-vmss/queue-metric-function
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install production dependencies
        working-directory: ${{ env.FUNC_DIR }}
        run: npm ci --omit=dev

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.TF_DEPLOY_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Function App name
        id: fn
        env:
          NAME_OVERRIDE: ${{ vars.QUEUE_METRIC_FUNCTION_NAME }}
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
        run: |
          set -euo pipefail
          NAME="${NAME_OVERRIDE}"
          if [ -z "${NAME}" ]; then
            [ -n "${RESOURCE_GROUP_NAME}" ] || { echo "::error::set the QUEUE_METRIC_FUNCTION_NAME or RESOURCE_GROUP_NAME repo variable"; exit 1; }
            NAME=$(az functionapp list -g "${RESOURCE_GROUP_NAME}" \
              --query "[?starts_with(name, 'func-ghrunner-queue-')].name | [0]" -o tsv || true)
          fi
          if [ -z "${NAME}" ]; then
            echo "::error::no 'func-ghrunner-queue-*' Function App in resource group '${RESOURCE_GROUP_NAME}' - run 'terraform apply' with enable_queue_metric_function = true first"
            exit 1
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Deploying to ${NAME}"

      - name: Deploy to Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.fn.outputs.name }}
          package: ${{ env.FUNC_DIR }}
          respect-funcignore: true
          scm-do-build-during-deployment: false
          enable-oryx-build: false
