name: Build and Push Runner Image (ACI backend)

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/build-and-push-runner-image.yml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: build-runner-image
  cancel-in-progress: false

jobs:
  build-and-push:
    if: vars.COMPUTE_BACKEND == 'aci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ACI_ORCHESTRATOR_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push via ACR Tasks
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "gh-runner:${{ github.sha }}" \
            --image "gh-runner:latest" \
            --file docker/Dockerfile \
            docker/
